# Builds Click.dmg on GitHub's Macs, runs the tests and a start-up self-test of the finished app,
# then publishes the .dmg as a Release.
#
# Which Macs: pushes to main build the INTEL version (the laptop Click is used on now).
# To build for Apple Silicon (M1-M4) or both, run this workflow by hand (Actions tab ->
# "Build Click for Mac" -> Run workflow) and pick "apple" or "both". Mac build time is limited on
# GitHub's free plan, so only the needed one is built.
name: Build Click for Mac

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macs:
        description: "Which Macs to build for"
        type: choice
        options: [intel, apple, both]
        default: intel

permissions:
  contents: write

concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          choice="${{ github.event.inputs.macs || 'intel' }}"
          intel='{"name":"Intel","runner":"macos-15-intel","images":false}'
          apple='{"name":"AppleSilicon","runner":"macos-15","images":true}'
          case "$choice" in
            apple) m="[$apple]";;
            both)  m="[$intel,$apple]";;
            *)     m="[$intel]";;
          esac
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SQLCipher (memory encryption)
        run: |
          brew install sqlcipher
          SQLC="$(brew --prefix sqlcipher)"
          CFLAGS="-I$SQLC/include -I$SQLC/include/sqlcipher" LDFLAGS="-L$SQLC/lib" \
            pip install --no-binary sqlcipher3 "sqlcipher3>=0.5"
          python -c "from sqlcipher3 import dbapi2; print('sqlcipher ok')"

      - name: Install Click's Python packages
        run: |
          python -m pip install --upgrade pip wheel
          grep -v '^sqlcipher3' pi-hub/requirements.txt > /tmp/hub-reqs.txt
          pip install -r /tmp/hub-reqs.txt -r pc-companion/requirements.txt -r pc-companion/requirements-mac.txt
          pip install "pyinstaller>=6.10" pytest pytest-asyncio

      - name: Install image generation (Apple Silicon only)
        if: matrix.images
        run: pip install torch -r pc-companion/requirements-images.txt

      - name: Run the tests
        run: |
          (cd pi-hub && python -m pytest -q)
          (cd pc-companion && QT_QPA_PLATFORM=offscreen python -m pytest -q)

      - name: Make the app icon
        run: |
          QT_QPA_PLATFORM=offscreen python packaging/make_icon.py packaging/Click.iconset
          iconutil -c icns packaging/Click.iconset -o packaging/Click.icns

      - name: Build the offline speech engine (whisper.cpp)
        run: |
          # Talking to Clicky stays on the Mac: whisper.cpp turns speech into text locally.
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          extra=""
          if [ "$(uname -m)" = "x86_64" ]; then
            # portable build for Intel Macs (2015+): AVX2/FMA, no Metal
            extra="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_METAL=OFF"
          fi
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/wbuild" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 $extra
          cmake --build "$RUNNER_TEMP/wbuild" --config Release -j 4 --target whisper-cli
          mkdir -p packaging/bin
          cp "$RUNNER_TEMP/wbuild/bin/whisper-cli" packaging/bin/whisper-cli
          packaging/bin/whisper-cli --help > /dev/null 2>&1 || packaging/bin/whisper-cli -h | head -3
          otool -L packaging/bin/whisper-cli

      - name: Build Click.app
        run: |
          pyinstaller --noconfirm --distpath dist --workpath build packaging/Click.spec
          codesign -dvv dist/Click.app 2>&1 | grep -E "Authority|Identifier" || true

      - name: Check the bundled speech engine understands speech
        run: |
          W=$(find dist/Click.app -name whisper-cli -type f | head -1)
          echo "engine: $W"; test -x "$W"
          curl -sL -o "$RUNNER_TEMP/tiny.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          "$W" -m "$RUNNER_TEMP/tiny.bin" -f "$RUNNER_TEMP/whisper.cpp/samples/jfk.wav" -nt -np -l en -t 4 | tee heard.txt
          grep -qi "ask not what your country" heard.txt

      - name: Check each Mac can stamp Click with its own signature
        run: |
          # No signing key is stored anywhere: every Mac makes its own on first install (selfsign.py).
          perl -e 'alarm shift; exec @ARGV' 300 dist/Click.app/Contents/MacOS/Click --selftest-sign

      - name: Check nothing needs a newer macOS than 14
        run: |
          # A library built for macOS 15 would crash Click on macOS 14 (it can't be caught by tests on 15).
          bad=0
          while IFS= read -r f; do
            v=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
            if [ -n "$v" ] && [ "$(printf '%s\n14.0\n' "$v" | sort -V | tail -1)" != "14.0" ]; then
              echo "NEEDS macOS $v: $f"; bad=1
            fi
          done < <(find dist/Click.app -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) | head -4000)
          [ $bad = 0 ] && echo "All binaries run on macOS 14+" || exit 1

      - name: Self-test the finished app (start, connect, show the chat page)
        run: |
          mkdir -p "$HOME/selftest"
          # macOS has no `timeout` command; perl's alarm does the same job
          run() { HOME="$HOME/selftest" QT_QPA_PLATFORM=offscreen perl -e 'alarm shift; exec @ARGV' 240 \
                    dist/Click.app/Contents/MacOS/Click --selftest --ui 2>&1 | tee -a selftest.log; }
          run
          echo "--- second start over the first run's data (like upgrading) ---" | tee -a selftest.log
          run
          test "$(grep -c 'SELFTEST OK' selftest.log)" -ge 2
          grep -q "SELFTEST UI OK" selftest.log || echo "::warning::chat page didn't display in the headless test"
          grep -q "SELFTEST VOICE OK" selftest.log || { echo "::error::voice isn't fully inside the app"; grep VOICE selftest.log; exit 1; }
          file dist/Click.app/Contents/MacOS/Click

      - name: Real start (like a person opening it after an update) - the chat must connect and answer
        run: |
          python packaging/ci/fake_ollama.py & sleep 2
          ver=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)', open('pc-companion/companion/__init__.py').read()).group(1))")
          echo "--- with the welcome showing (first start after an update) ---"
          python packaging/ci/realstart.py --app dist/Click.app/Contents/MacOS/Click --home "$HOME/selftest" --seconds 60
          echo "--- normal start, with the companion brain running ---"
          python packaging/ci/realstart.py --app dist/Click.app/Contents/MacOS/Click --home "$HOME/selftest" --seconds 120 --version "$ver"

      - name: Make the .dmg
        run: |
          mkdir -p dmg && cp -R dist/Click.app dmg/ && ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on GitHub's Macs; retry a few times
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Click" -srcfolder dmg -ov -format UDZO "Click-${{ matrix.name }}.dmg" && break
            echo "hdiutil busy, retrying ($i)"; sleep $((i * 5))
          done
          test -f "Click-${{ matrix.name }}.dmg"
          ls -lh "Click-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Click-${{ matrix.name }}
          path: Click-${{ matrix.name }}.dmg
          retention-days: 14

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Click for Mac (build ${{ github.run_number }})
          make_latest: true
          files: Click-${{ matrix.name }}.dmg
          body: |
            **Which file:** Intel Mac (Core i5/i7/i9) -> `Click-Intel.dmg`. M1/M2/M3/M4 -> `Click-AppleSilicon.dmg`.
            Needs macOS 14 (Sonoma) or newer.

            **Install:** open the .dmg, drag Click into Applications, then open Click.
            If macOS blocks it: System Settings -> Privacy & Security -> scroll down -> "Open Anyway".
